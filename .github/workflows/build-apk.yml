name: Build APK

# Gera o APK do Refrigeração Pro a cada push/PR e disponibiliza como artefato.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Não instala o pacote obsoleto "tools" (que baixa o emulador e às vezes
          # falha com "Error on ZipFile unknown archive"). O Android Gradle Plugin
          # baixa a plataforma e o build-tools necessários automaticamente.
          packages: platform-tools

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permissão de execução do gradlew
        run: chmod +x ./gradlew

      - name: Build do APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: refrigeracao-pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
